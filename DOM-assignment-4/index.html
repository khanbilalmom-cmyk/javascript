<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script async src="script.js"></script>
    <style>
      .body {
        background-color: blueviolet;
      }
      .highlight {
        background-color: yellowgreen;
        color: red;
        padding: 30px;
        font-weight: bolder;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        background-color: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }
      h3 {
        color: red;
      }
      .active-btn {
        background-color: green;
        color: white;
        border: 3px solid darkgreen;
      }
      .dark-mode {
        border-color: black;
        color: white;
      }
      .dark-mode h3 {
        color: white;
      }
      .dark-mode button {
        border: 2px solid white;
      }
    </style>
  </head>
  <body>
    <p id="mypara">this is javascript DOM Manipulation</p>
    <button id="addBtn">add highlight</button> <br /><br />
    <button id="toggleBtn">remove highlight</button><br /><br />
    <button id="toggle">toggle hightlight</button>
    <button id="check">Check class</button>
    <h3>Button active state</h3>
    <button id="buy">Buy now</button>
    <h3>DARK Mode</h3>
    <button id="dark">Dark Mode</button>
  </body>
</html>
