<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script async src="script.js"></script>
  </head>
  <body>
    <h3>Button evnt click</h3>
    <button id="click">click me</button>

    <h2>Change text on click</h2>
    <p id="mytext">this is paragraph</p>
    <button id="change">change text</button>

    <h3>background color</h3>
    <button id="background">change background</button>\

    <h3>input event live typing</h3>
    <input type="text" placeholder="write something" id="input" />
    <p id="output">your text will appear here</p>

    <h3>Mouse event</h3>
    <div id="hover">Move mouse here</div>

    <h3>Double click</h3>
    <button id="double">Double click</button>
  </body>
</html>
